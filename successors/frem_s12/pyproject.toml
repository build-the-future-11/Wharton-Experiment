[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frem-s12"
version = "0.1.4"
description = "Causal multiscale memory-router research with reproducible campaign execution"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.5.4; python_version < '3.13'",
  "numpy==2.1.3; python_version >= '3.13'",
]
readme = "README.md"

[project.scripts]
s12-research = "frem_s12.cli:main"

[dependency-groups]
quality = ["pytest==8.4.2", "ruff==0.17.0", "mypy>=1.19,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frem_s12 = ["py.typed", "protocol_p0.json", "protocol_p0_v3.json", "protocol_p0_v4.json", "protocol_p0_v5.json", "protocol_p0_v6.json", "protocol_p0_v7.json", "sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
  "unit: isolated contract or numerical check",
  "reference: independently derived expected value",
  "integration: bounded generated pipeline",
  "market: explicit market execution excluded from default collection",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "C90", "D"]

[tool.ruff.lint.isort]
known-first-party = ["frem_s12"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_unreachable = true

