[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frem-s14"
version = "0.1.7"
description = "Reservoir, graph engram, stochastic-field JEPA and bounded neurogenesis research"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "torch>=2.4,<3", "scipy>=1.12,<2", "xgboost>=2.1,<4", "packaging>=23"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
frem-s14 = "frem_s14.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

