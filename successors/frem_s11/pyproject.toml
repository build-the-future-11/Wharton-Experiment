[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frem-s11"
version = "0.1.0"
description = "Release-vintage specialist ensemble research with causal score feedback"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.4"]
readme = "README.md"

[project.scripts]
s11-research = "frem_s11.cli:main"

[dependency-groups]
quality = ["pytest==8.4.2", "ruff==0.17.0", "mypy>=1.19,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frem_s11 = ["py.typed", "protocol.json", "protocol_v2.json", "sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
  "unit: isolated contract or numerical check",
  "reference: independently derived expected value",
  "integration: bounded generated pipeline",
  "market: explicit release-vintage research, excluded from normal collection",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "C90", "D"]

[tool.ruff.lint.isort]
known-first-party = ["frem_s11"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"successors/frem_s11/tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_unreachable = true

