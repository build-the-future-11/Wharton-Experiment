[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "wharton-final-candidate"
version = "0.3.0.dev0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "scikit-learn>=1.3", "torch>=2.0", "xgboost>=2.0"]
[tool.setuptools.packages.find]
include = ["wharton_final*"]
