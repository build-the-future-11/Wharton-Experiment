[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frem-research"
version = "0.1.0"
description = "Prospective causal Fourier-reservoir engram research with protected financial evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2", "torch>=2.4,<3", "pyarrow>=16,<22"
]

[project.optional-dependencies]
trees = ["xgboost>=2.1,<4"]
data = ["requests>=2.32,<3", "yfinance>=0.2.54,<1"]
reports = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "build>=1.2,<2"]
all = ["xgboost>=2.1,<4", "requests>=2.32,<3", "yfinance>=0.2.54,<1", "matplotlib>=3.8,<4", "pytest>=8,<9", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
frem = "frem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Public validators intentionally use ValueError for invalid user-supplied
# values, including values of the wrong JSON type. Preserve that API contract.
ignore = ["TRY004"]
