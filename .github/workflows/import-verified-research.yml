name: Import verified research repairs
on:
  push:
    branches: [research/portfolio-verification-2026-09-29]
    paths: [.github/workflows/import-verified-research.yml]
permissions:
  contents: write
concurrency:
  group: verified-research-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/portfolio-verification-2026-09-29
          fetch-depth: 0
      - name: Verify transfer and apply only the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8e3d790dd513a93b7d80d5726a8b2708e8615b71 HEAD
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'research_transfer/core-{i:02d}.b64').read_text().strip() for i in range(1, 5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          actual = hashlib.sha256(patch).hexdigest()
          assert actual == 'a5778731dc1e749dc5c9f03e7e8a67d3a5725e222b2d4000b9aa5805eb97dd19', actual
          Path('/tmp/verified-research.patch').write_bytes(patch)
          print('Patch checksum verified:', actual)
          PY
          git apply --check --unidiff-zero /tmp/verified-research.patch
          git apply --index --unidiff-zero /tmp/verified-research.patch
          python3 -m compileall -q src tests scripts
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          paths = sorted(Path('src').rglob('*.py')) + [Path('scripts/run_portfolio_research.py'), Path('protocol/PORTFOLIO_RESEARCH_V1.md')]
          hashes = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          actual = hashlib.sha256(json.dumps(hashes, sort_keys=True).encode()).hexdigest()
          expected = '39292d20615c26dc7e310b6543ca36651063ded1a6369f9255e82897f70ad045'
          assert actual == expected, actual
          print('Experimental source fingerprint verified:', actual)
          receipt = {'upstream_baseline': '8e3d790dd513a93b7d80d5726a8b2708e8615b71', 'patch_sha256': 'a5778731dc1e749dc5c9f03e7e8a67d3a5725e222b2d4000b9aa5805eb97dd19', 'source_fingerprint': actual, 'remote_checks': ['patch checksum', 'clean patch applicability', 'Python syntax compilation', 'exact experimental source fingerprint'], 'tests_and_experiments_executed_locally_not_in_this_workflow': True}
          target = Path('reports/portfolio_2026-09-29/REMOTE_IMPORT.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Commit verified source on the research branch only
        shell: bash
        run: |
          set -euo pipefail
          git rm research_transfer/core-01.b64 research_transfer/core-02.b64 research_transfer/core-03.b64 research_transfer/core-04.b64
          git rm .github/workflows/import-verified-research.yml
          git add reports/portfolio_2026-09-29/REMOTE_IMPORT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply verified twelve-model repairs and causal evaluation harness'
          git push origin HEAD:refs/heads/research/portfolio-verification-2026-09-29
